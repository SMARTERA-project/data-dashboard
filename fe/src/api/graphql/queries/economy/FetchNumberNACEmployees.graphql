query FetchNumberNACEmployees($pilot_nuts3: String!) {
  datapoints(
    survey: "nama_10r_3empers"
    sortBy: ["year", "value"]
    sortOrder: ["desc", "desc"]
    dimensions: [$pilot_nuts3, "Total - all NACE activities"]
    limit: 1
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
