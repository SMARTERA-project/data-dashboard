query FetchTransportedGoods($pilot_nuts3: String!) {
  datapoints(
    survey: "road_go_na_rl3g"
    sortBy: ["year", "value"]
    sortOrder: ["desc", "desc"]
    dimensions: [$pilot_nuts3, "Total transported goods"]
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
