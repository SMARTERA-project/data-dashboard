query FetchTopTransported($pilot_nuts3: String!) {
  datapoints(
    survey: "road_go_na_rl3g"
    sortBy: ["year", "value"]
    sortOrder: ["desc", "desc"]
    dimensions: [$pilot_nuts3]
    exclude: ["Total transported goods"]
    limit: 6
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
