query FetchLivingCategory($pilot_nuts3: String!) {
  datapoints(
    survey: "cens_21lha_r3"
    sortBy: "value"
    sortOrder: "desc"
    dimensions: [$pilot_nuts3]
    exclude: ["Females", "Males"]
    filterBy: 2
    filter: ["Total"]
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
