query FetchDisposalCapacity($pilot_nuts2: String!) {
  datapoints(
    survey: "ENV_WASFAC"
    sortBy: ["year", "value"]
    sortOrder: ["desc", "desc"]
    dimensions: [$pilot_nuts2, "Rest capacity - cubic metres"]
    exclude: ["Facilities - number"]
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
