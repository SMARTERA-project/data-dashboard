query FetchRecyclingFacilities($pilot_nuts2: String!) {
  datapoints(
    survey: "ENV_WASFAC"
    sortBy: ["year", "value"]
    sortOrder: ["desc", "desc"]
    dimensions: [$pilot_nuts2, "Recovery - recycling", "Facilities - number"]
    limit: 1
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
