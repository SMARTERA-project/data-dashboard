query FetchRecyclingPlusFacilities($pilot_nuts2: String!) {
  datapoints(
    survey: "ENV_WASFAC"
    sortBy: ["year", "value"]
    sortOrder: ["desc", "desc"]
    dimensions: [
      $pilot_nuts2
      "Facilities - number"
      "Recovery - recycling and backfilling (R2-R11)"
    ]
    limit: 1
  ) {
    region
    source
    timestamp
    survey
    dimensions
    value
  }
}
